<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eboard HQ</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">★</span>
      <h1>Eboard&nbsp;HQ</h1>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="members">Members</button>
      <button class="tab" data-view="projects">Projects</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <span id="syncStatus" class="sync-status">Loading…</span>
    <span class="dot-sep">·</span>
    <span><button id="exportBtn" class="link-btn">Export backup</button> · <button id="importBtn" class="link-btn">Import backup</button></span>
    <input type="file" id="importFile" accept="application/json" hidden />
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
